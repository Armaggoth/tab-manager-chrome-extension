<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Manager</title>
    <link rel="stylesheet" href="side-panel.css" />
  </head>
  <body>
    <div class="container" role="main">
      <header>
        <h1 id="app-title">Tab Manager</h1>
        <img
          id="pinned-tabs-ignored-cue"
          class="pinned-tabs-ignored-cue"
          src="assets/no-pin.png"
          alt="Pinned tabs are ignored"
          title="Pinned tabs are ignored by tab actions"
          aria-label="Pinned tabs are ignored by tab actions"
          hidden
        />
      </header>

      <section class="debug-section" aria-labelledby="debug-section-title" hidden>
        <h2 id="debug-section-title">Sorting Debug</h2>
        <div class="debug-controls">
          <button
            id="scramble-tabs"
            class="btn btn-secondary"
            aria-label="Scramble tabs"
            title="Randomly reorder unpinned tabs in the current window"
          >
            Scramble Tabs
          </button>
          <button
            id="read-current-domains"
            class="btn btn-secondary"
            aria-label="Read current domains"
            title="Read every tab in the current window before sorting"
          >
            Read Current Domains
          </button>
          <button
            id="read-all-windows"
            class="btn btn-secondary"
            aria-label="Read all windows"
            title="Read every tab from every browser window"
          >
            Read All Windows
          </button>
          <button
            id="copy-tab-list"
            class="btn btn-secondary"
            aria-label="Copy tab list"
            title="Copy the current tab list to the clipboard"
          >
            Copy Tab List
          </button>
        </div>
        <p id="debug-status" class="debug-status" role="status" aria-live="polite">
          Click to read the current window.
        </p>
        <ol id="debug-tabs-list" class="debug-tabs-list" aria-label="Current window tabs"></ol>
      </section>

      <section aria-labelledby="actions-section-title">
        <h2 id="actions-section-title">Actions</h2>
        <div id="usage-suggestion" class="usage-suggestion" role="status" hidden>
          <p id="usage-suggestion-message"></p>
          <div class="usage-suggestion-actions">
            <button id="usage-suggestion-sort" class="btn btn-primary">Sort by Usage</button>
            <button id="usage-suggestion-later" class="btn btn-secondary">Not Now</button>
            <button id="usage-suggestion-disable" class="btn btn-secondary">Don't Ask</button>
          </div>
        </div>
        <div id="actions-grid" class="actions-grid" role="group" aria-label="Tab management actions"></div>
      </section>

      <footer>
        <button
          id="settings-btn"
          class="btn btn-small"
          aria-label="Open settings"
          title="Open extension settings"
        >
          ⚙️ Settings
        </button>
      </footer>
    </div>

    <script src="side-panel.js" type="module"></script>
  </body>
</html>
